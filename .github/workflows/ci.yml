name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded PR commits can stop; main and manual runs keep unique groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check PR body auto-close keywords
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-pr-autoclose-keywords.js --body-env PR_BODY

      - name: Run PR preflight
        if: github.event_name == 'pull_request'
        run: bash scripts/preflight.sh --base "${{ github.event.pull_request.base.sha }}" --skip-release-state

      - name: Run main preflight
        if: github.event_name != 'pull_request'
        run: bash scripts/preflight.sh --skip-payload-source --skip-release-state

  windows-install-smoke:
    name: windows-install-smoke (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2022
          - windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: PowerShell install smoke
        shell: powershell
        run: node --test tests/install-smoke.test.js tests/hook-entrypoints.test.js

  linux-native-compat:
    name: linux-native-compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install native verification dependency
        run: npm install --global node-lief@1.3.2

      - name: Verify Linux native baseline
        run: node scripts/verify-upstream-compat.js --skip-latest --native-linux-x64 --fail-on-skip --json --verify-install

      - name: Verify upgrade through the installed launcher
        shell: bash
        run: bash scripts/verify-native-upgrade.sh

  windows-native-compat:
    name: windows-native-compat (${{ matrix.shard }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install native verification dependency
        run: npm install --global node-lief@1.3.2

      - name: Verify upgrade through the installed launcher
        if: matrix.shard == 0
        shell: bash
        run: bash scripts/verify-native-upgrade.sh

      - name: Verify Windows native support window
        shell: powershell
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          $AllVersions = (Get-Content scripts/upstream-compat.config.json -Raw | ConvertFrom-Json).support.windowsNativeExperimental.representatives
          $Versions = @(for ($i = [int]$env:SHARD; $i -lt $AllVersions.Count; $i += 4) { $AllVersions[$i] })
          if ($Versions.Count -eq 0) { throw "Empty Windows verification shard" }
          node scripts/verify-upstream-compat.js --skip-latest --native-windows-x64 --json --baseline "$($Versions -join ',')" --verify-install --fail-on-skip

  macos-bytecode-compat:
    name: macos-bytecode-compat
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install native verification dependency
        run: npm install --global node-lief@1.3.2
      - name: Verify published bytecode versions
        run: |
          VERSIONS="$(node -p 'require("./scripts/upstream-compat.config.json").support.macosNativeExperimental.representatives.filter(v => Number(v.split(".")[2]) >= 242).join(",")')"
          test -n "$VERSIONS"
          node scripts/verify-upstream-compat.js --baseline "$VERSIONS" --skip-latest --native-macos-arm64 --fail-on-skip --json --verify-install

      - name: Verify upgrade through the installed launcher
        shell: bash
        run: bash scripts/verify-native-upgrade.sh

  macos-x64-build:
    name: macos-x64-build
    runs-on: macos-15-intel
    env:
      CLAUDE_VERSION: "2.1.296"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          architecture: x64
      - name: Install native build dependency
        run: npm install --global node-lief@1.3.2
      - name: Build and verify the localized Intel binary
        shell: bash
        run: |
          test "$(node -p 'process.platform + "-" + process.arch')" = darwin-x64
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          archive="$(npm pack "@anthropic-ai/claude-code-darwin-x64@$CLAUDE_VERSION" --pack-destination "$work" --silent)"
          tar -xzf "$work/$archive" -C "$work"
          upstream="$work/package/claude"
          test "$(lipo -archs "$upstream")" = x86_64

          mkdir "$work/build" "$work/config"
          export CLAUDE_CONFIG_DIR="$work/config"
          cp -p "$upstream" "$work/build/claude"
          node scripts/patch-bytecode.js patch "$work/build/claude" cli-translations.json --json
          codesign --verify --strict "$work/build/claude"
          test "$(lipo -archs "$work/build/claude")" = x86_64
          version_output="$("$work/build/claude" --version)"
          test "${version_output%% *}" = "$CLAUDE_VERSION"
          "$work/build/claude" --help > "$work/help.txt"
          grep -F '用法' "$work/help.txt"
          node scripts/verify-native-install.js "$upstream"

          tar -czf "$RUNNER_TEMP/claude-zh-cn-darwin-x64.tar.gz" -C "$work/build" claude
      - uses: actions/upload-artifact@v6
        with:
          name: claude-zh-cn-darwin-x64-${{ env.CLAUDE_VERSION }}
          path: ${{ runner.temp }}/claude-zh-cn-darwin-x64.tar.gz
          if-no-files-found: error
